<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Kubernetes resource requests and limits</title><desc id="d">Container requests contribute to Pod scheduling requirements. CPU limits can throttle; memory-limit violations may result in OOM termination.</desc><rect width="1600" height="900" fill="#071225"/><text x="80" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Resource requests and limits</text><text x="80" y="140" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="24">Requests influence placement. Limits constrain runtime consumption.</text><g font-family="Arial,sans-serif"><rect x="80" y="220" rx="28" width="690" height="520" fill="#142745" stroke="#3c638f" stroke-width="3"/><text x="125" y="290" fill="#7dd3fc" font-size="34" font-weight="700">REQUESTS = RESERVED CAPACITY SIGNAL</text><text x="125" y="345" fill="#fff" font-size="25">Example container request:</text><text x="125" y="395" fill="#dce8f8" font-size="24" font-weight="700">CPU: 1 · Memory: 2 GiB</text><text x="125" y="460" fill="#c8d7ee" font-size="21">• The scheduler considers the Pod's effective request.</text><text x="125" y="505" fill="#c8d7ee" font-size="21">• It selects a node with sufficient allocatable capacity.</text><text x="125" y="550" fill="#c8d7ee" font-size="21">• “1 CPU” is one Kubernetes CPU unit.</text><text x="125" y="595" fill="#c8d7ee" font-size="21">• Requests are not a hard maximum.</text><rect x="830" y="220" rx="28" width="690" height="520" fill="#29204b" stroke="#6f56a8" stroke-width="3"/><text x="875" y="290" fill="#ded1ff" font-size="34" font-weight="700">LIMITS = RUNTIME CEILING</text><text x="875" y="345" fill="#fff" font-size="25">Example container limit:</text><text x="875" y="395" fill="#eee8ff" font-size="24" font-weight="700">CPU: 2 · Memory: 4 GiB</text><text x="875" y="460" fill="#e0d8ff" font-size="21">• CPU use above the limit can be throttled.</text><text x="875" y="505" fill="#e0d8ff" font-size="21">• Memory enforcement is reactive.</text><text x="875" y="550" fill="#e0d8ff" font-size="21">• Exceeding a memory limit may lead to OOM kill.</text><text x="875" y="595" fill="#e0d8ff" font-size="21">• Restart behaviour follows the Pod restart policy.</text></g><rect x="180" y="785" rx="18" width="1240" height="70" fill="#0e1f38"/><text x="800" y="830" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">Precise wording matters: CPU throttling is expected; OOM termination is possible, not guaranteed at the exact limit boundary.</text></svg>