<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Kubernetes storage mental model</title><desc id="d">StorageClass is a provisioning blueprint, PVC is a storage request, PV is the Kubernetes representation of allocated storage, and the backing volume is the actual storage asset.</desc><rect width="1600" height="900" fill="#071225"/><text x="80" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Persistent storage: blueprint, request, record and backing asset</text><text x="80" y="140" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="24">The PV is a Kubernetes object representing storage — not necessarily the physical storage system itself</text><g font-family="Arial,sans-serif"><rect x="80" y="245" rx="24" width="310" height="360" fill="#142745"/><text x="235" y="320" text-anchor="middle" fill="#7dd3fc" font-size="30" font-weight="700">StorageClass</text><text x="235" y="365" text-anchor="middle" fill="#fff" font-size="23">Fulfilment blueprint</text><text x="235" y="420" text-anchor="middle" fill="#c9d8ed" font-size="19">Provisioner</text><text x="235" y="454" text-anchor="middle" fill="#c9d8ed" font-size="19">Parameters</text><text x="235" y="488" text-anchor="middle" fill="#c9d8ed" font-size="19">Binding and reclaim behaviour</text><path d="M400 425 H500" stroke="#7dd3fc" stroke-width="8"/><polygon points="500,425 470,408 470,442" fill="#7dd3fc"/><rect x="510" y="245" rx="24" width="300" height="360" fill="#29204b"/><text x="660" y="320" text-anchor="middle" fill="#ded1ff" font-size="30" font-weight="700">PVC</text><text x="660" y="365" text-anchor="middle" fill="#fff" font-size="23">Tenant storage request</text><text x="660" y="420" text-anchor="middle" fill="#eee8ff" font-size="19">Capacity</text><text x="660" y="454" text-anchor="middle" fill="#eee8ff" font-size="19">Access modes</text><text x="660" y="488" text-anchor="middle" fill="#eee8ff" font-size="19">Optional StorageClass</text><path d="M820 425 H920" stroke="#7dd3fc" stroke-width="8"/><polygon points="920,425 890,408 890,442" fill="#7dd3fc"/><rect x="930" y="245" rx="24" width="300" height="360" fill="#173c3a"/><text x="1080" y="320" text-anchor="middle" fill="#bceee6" font-size="30" font-weight="700">PV</text><text x="1080" y="365" text-anchor="middle" fill="#fff" font-size="23">Kubernetes representation</text><text x="1080" y="420" text-anchor="middle" fill="#d8fbf5" font-size="19">Represents storage</text><text x="1080" y="454" text-anchor="middle" fill="#d8fbf5" font-size="19">available to the cluster</text><text x="1080" y="488" text-anchor="middle" fill="#d8fbf5" font-size="19">and bound to a claim</text><path d="M1240 425 H1340" stroke="#7dd3fc" stroke-width="8"/><polygon points="1340,425 1310,408 1310,442" fill="#7dd3fc"/><rect x="1350" y="245" rx="24" width="190" height="360" fill="#332d1d"/><text x="1445" y="320" text-anchor="middle" fill="#ffe9a8" font-size="28" font-weight="700">Backing</text><text x="1445" y="355" text-anchor="middle" fill="#ffe9a8" font-size="28" font-weight="700">volume</text><text x="1445" y="420" text-anchor="middle" fill="#fff3c9" font-size="18">Cloud disk</text><text x="1445" y="454" text-anchor="middle" fill="#fff3c9" font-size="18">SAN volume</text><text x="1445" y="488" text-anchor="middle" fill="#fff3c9" font-size="18">File share</text><text x="1445" y="522" text-anchor="middle" fill="#fff3c9" font-size="18">Other storage</text></g><rect x="175" y="675" rx="20" width="1250" height="120" fill="#0e1f38"/><text x="800" y="725" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Dynamic provisioning</text><text x="800" y="765" text-anchor="middle" fill="#b9c9df" font-family="Arial,sans-serif" font-size="21">A PVC can trigger a provisioner, guided by a StorageClass, to create a backing volume and corresponding PV.</text></svg>