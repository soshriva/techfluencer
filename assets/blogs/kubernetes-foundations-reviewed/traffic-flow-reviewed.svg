<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Kubernetes application traffic flow</title><desc id="d">Traffic flows from a user through an edge load balancer to an Ingress controller or Gateway, then a Service, Pod and containerised application.</desc><rect width="1600" height="900" fill="#071225"/><text x="80" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Application traffic: mall entrance to application counter</text><text x="80" y="140" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="24">Ingress is configuration; an Ingress controller implements it. Gateway API is the newer extensible model.</text><g font-family="Arial,sans-serif"><rect x="70" y="285" rx="24" width="220" height="220" fill="#142745"/><text x="180" y="365" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">User</text><text x="180" y="412" text-anchor="middle" fill="#c9d8ed" font-size="21">Visitor</text><path d="M300 395 H390" stroke="#7dd3fc" stroke-width="8"/><polygon points="390,395 360,378 360,412" fill="#7dd3fc"/><rect x="400" y="245" rx="24" width="300" height="300" fill="#1b3152"/><text x="550" y="320" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Edge / Load balancer</text><text x="550" y="370" text-anchor="middle" fill="#c9d8ed" font-size="21">Mall entrance infrastructure</text><text x="550" y="420" text-anchor="middle" fill="#b5c9e3" font-size="19">Delivers traffic to an</text><text x="550" y="452" text-anchor="middle" fill="#b5c9e3" font-size="19">Ingress controller or Gateway</text><path d="M710 395 H790" stroke="#7dd3fc" stroke-width="8"/><polygon points="790,395 760,378 760,412" fill="#7dd3fc"/><rect x="800" y="225" rx="24" width="330" height="340" fill="#29204b"/><text x="965" y="300" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Ingress controller</text><text x="965" y="342" text-anchor="middle" fill="#ded1ff" font-size="22">or Gateway implementation</text><text x="965" y="405" text-anchor="middle" fill="#eee8ff" font-size="19">Implements routing rules</text><text x="965" y="438" text-anchor="middle" fill="#eee8ff" font-size="19">and selects a Service</text><text x="965" y="490" text-anchor="middle" fill="#b9a9e8" font-size="18">Ingress resource alone does not</text><text x="965" y="519" text-anchor="middle" fill="#b9a9e8" font-size="18">process traffic</text><path d="M1140 395 H1210" stroke="#7dd3fc" stroke-width="8"/><polygon points="1210,395 1180,378 1180,412" fill="#7dd3fc"/><rect x="1220" y="245" rx="24" width="300" height="300" fill="#173c3a"/><text x="1370" y="320" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Service</text><text x="1370" y="370" text-anchor="middle" fill="#c8f4ec" font-size="21">Stable network identity</text><text x="1370" y="420" text-anchor="middle" fill="#d8fbf5" font-size="19">Forwards to selected</text><text x="1370" y="452" text-anchor="middle" fill="#d8fbf5" font-size="19">backend Pods</text><path d="M1370 555 V640" stroke="#7dd3fc" stroke-width="8"/><polygon points="1370,640 1353,610 1387,610" fill="#7dd3fc"/><rect x="1095" y="655" rx="24" width="550" height="150" fill="#332d1d"/><text x="1370" y="715" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">Pod → containerised application</text><text x="1370" y="760" text-anchor="middle" fill="#fff3c9" font-size="20">The selected application process handles the request</text></g></svg>