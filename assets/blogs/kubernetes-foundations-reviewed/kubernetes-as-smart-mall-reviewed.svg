<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Kubernetes as a smart shopping mall</title><desc id="d">A reviewed mental model mapping cluster, control plane, worker nodes, namespaces, Pods, containers, Services, storage and policy to a shopping mall.</desc><rect width="1600" height="900" fill="#071225"/><text x="80" y="95" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Kubernetes as a smart shopping mall</text><text x="80" y="140" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="24">A memory aid — not a one-to-one technical definition</text><g font-family="Arial,sans-serif"><rect x="70" y="190" rx="28" width="1460" height="620" fill="#0d1b34" stroke="#31547e" stroke-width="3"/><text x="110" y="245" fill="#7dd3fc" font-size="25" font-weight="700">CLUSTER = ENTIRE MALL ECOSYSTEM</text><rect x="120" y="285" rx="20" width="430" height="190" fill="#142745"/><text x="150" y="335" fill="#fff" font-size="30" font-weight="700">Control plane</text><text x="150" y="375" fill="#c8d7ee" font-size="22">Mall management office</text><text x="150" y="415" fill="#c8d7ee" font-size="20">Accepts desired state, records it,</text><text x="150" y="445" fill="#c8d7ee" font-size="20">schedules and reconciles.</text><rect x="585" y="285" rx="20" width="420" height="190" fill="#142745"/><text x="615" y="335" fill="#fff" font-size="30" font-weight="700">Worker nodes</text><text x="615" y="375" fill="#c8d7ee" font-size="22">Floors or wings</text><text x="615" y="415" fill="#c8d7ee" font-size="20">Compute locations where Pods</text><text x="615" y="445" fill="#c8d7ee" font-size="20">actually run.</text><rect x="1040" y="285" rx="20" width="420" height="190" fill="#142745"/><text x="1070" y="335" fill="#fff" font-size="30" font-weight="700">Namespaces</text><text x="1070" y="375" fill="#c8d7ee" font-size="22">Logical brand / team scope</text><text x="1070" y="415" fill="#c8d7ee" font-size="20">Groups and names resources;</text><text x="1070" y="445" fill="#c8d7ee" font-size="20">not a physical runtime location.</text><rect x="120" y="520" rx="20" width="300" height="220" fill="#102c36"/><text x="150" y="570" fill="#fff" font-size="28" font-weight="700">Pod</text><text x="150" y="610" fill="#bceee6" font-size="22">Outlet or counter</text><text x="150" y="650" fill="#d7f7f1" font-size="19">Smallest deployable unit.</text><text x="150" y="683" fill="#d7f7f1" font-size="19">Contains one or more</text><text x="150" y="716" fill="#d7f7f1" font-size="19">tightly coupled containers.</text><rect x="450" y="520" rx="20" width="300" height="220" fill="#29204b"/><text x="480" y="570" fill="#fff" font-size="28" font-weight="700">Container</text><text x="480" y="610" fill="#ded1ff" font-size="22">Packaged app process</text><text x="480" y="650" fill="#eee8ff" font-size="19">Runs inside the Pod</text><text x="480" y="683" fill="#eee8ff" font-size="19">with its runtime</text><text x="480" y="716" fill="#eee8ff" font-size="19">dependencies.</text><rect x="780" y="520" rx="20" width="300" height="220" fill="#2f2434"/><text x="810" y="570" fill="#fff" font-size="28" font-weight="700">Service</text><text x="810" y="610" fill="#ffd5ef" font-size="22">Stable directory entry</text><text x="810" y="650" fill="#ffe6f4" font-size="19">Stable network identity</text><text x="810" y="683" fill="#ffe6f4" font-size="19">for a changing set</text><text x="810" y="716" fill="#ffe6f4" font-size="19">of selected Pods.</text><rect x="1110" y="520" rx="20" width="350" height="220" fill="#332d1d"/><text x="1140" y="570" fill="#fff" font-size="28" font-weight="700">Storage & policy</text><text x="1140" y="610" fill="#ffe9a8" font-size="22">Rooms, blueprints, access rules</text><text x="1140" y="650" fill="#fff3c9" font-size="19">PVCs request storage;</text><text x="1140" y="683" fill="#fff3c9" font-size="19">policies govern traffic,</text><text x="1140" y="716" fill="#fff3c9" font-size="19">security and capacity.</text></g><text x="80" y="855" fill="#8ea7c7" font-family="Arial,sans-serif" font-size="20">Use the analogy to remember relationships; use Kubernetes definitions for implementation decisions.</text></svg>