<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Worker node versus Namespace</title><desc id="d">Worker nodes are runtime locations; Namespaces are logical scopes for grouping and governing resources.</desc><rect width="1600" height="900" fill="#071225"/><text x="80" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Worker node vs Namespace</text><text x="80" y="140" fill="#9fb4d3" font-family="Arial,sans-serif" font-size="25">Where it runs is different from how it is organised</text><g font-family="Arial,sans-serif"><rect x="80" y="200" rx="26" width="650" height="560" fill="#10233f" stroke="#3c638f" stroke-width="3"/><text x="125" y="265" fill="#7dd3fc" font-size="30" font-weight="700">WORKER NODES = MALL FLOORS / WINGS</text><text x="125" y="315" fill="#dce8f8" font-size="24">Physical or virtual compute locations</text><rect x="145" y="365" rx="18" width="520" height="110" fill="#173457"/><text x="180" y="415" fill="#fff" font-size="26" font-weight="700">worker-node-01</text><text x="180" y="452" fill="#c8d7ee" font-size="20">payments Pod + risk Pod</text><rect x="145" y="500" rx="18" width="520" height="110" fill="#173457"/><text x="180" y="550" fill="#fff" font-size="26" font-weight="700">worker-node-02</text><text x="180" y="587" fill="#c8d7ee" font-size="20">payments Pod + reporting Pod</text><text x="125" y="690" fill="#a8bdd8" font-size="21">A node can host Pods from multiple Namespaces.</text><rect x="870" y="200" rx="26" width="650" height="560" fill="#1f183d" stroke="#6f56a8" stroke-width="3"/><text x="915" y="265" fill="#d8c7ff" font-size="30" font-weight="700">NAMESPACES = LOGICAL BRAND / TEAM SCOPES</text><text x="915" y="315" fill="#eee8ff" font-size="24">Group and name Kubernetes resources</text><rect x="935" y="365" rx="18" width="520" height="110" fill="#2d2455"/><text x="970" y="415" fill="#fff" font-size="26" font-weight="700">namespace: payments</text><text x="970" y="452" fill="#e0d8ff" font-size="20">Pods may run on node-01 and node-02</text><rect x="935" y="500" rx="18" width="520" height="110" fill="#2d2455"/><text x="970" y="550" fill="#fff" font-size="26" font-weight="700">namespace: risk</text><text x="970" y="587" fill="#e0d8ff" font-size="20">Policies, RBAC and quotas can be applied</text><text x="915" y="690" fill="#cdbff0" font-size="21">A Namespace can span multiple worker nodes.</text></g><text x="80" y="830" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Memory hook:</text><text x="290" y="830" fill="#b9c9df" font-family="Arial,sans-serif" font-size="30">Worker node = runtime location · Namespace = logical scope</text></svg>