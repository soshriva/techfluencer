<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="720" viewBox="0 0 1640 720" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#06142b"/><stop offset="1" stop-color="#05040f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.35" opacity="0.16"/></pattern>
    <style>
      .title{font:800 44px Manrope,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}.subtitle{font:500 20px DM Sans,Arial,sans-serif;fill:#a9b9d4}.label{font:700 18px DM Sans,Arial,sans-serif;fill:#f8fafc}.small{font:500 14px DM Sans,Arial,sans-serif;fill:#cbd5e1}.tiny{font:500 12px DM Sans,Arial,sans-serif;fill:#a8b4c7}.box{fill:rgba(7,18,38,.78);stroke:#2563eb;stroke-width:1.4;rx:20}.box2{fill:rgba(17,12,42,.72);stroke:#a855f7;stroke-width:1.4;rx:20}.box3{fill:rgba(6,31,28,.72);stroke:#14b8a6;stroke-width:1.4;rx:20}.box4{fill:rgba(34,26,4,.70);stroke:#eab308;stroke-width:1.4;rx:20}.chip{fill:rgba(15,23,42,.86);stroke:#3b82f6;stroke-width:1;rx:12}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#arrow)}.arrowp{stroke:#a855f7;stroke-width:4;fill:none;marker-end:url(#arrowp)}.arrowg{stroke:#84cc16;stroke-width:4;fill:none;marker-end:url(#arrowg)}.num{font:800 22px Manrope,Arial,sans-serif;fill:#fff}.accent-blue{fill:#38bdf8}.accent-purple{fill:#a855f7}.accent-green{fill:#84cc16}.accent-yellow{fill:#facc15}.muted{fill:#94a3b8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#84cc16"/></marker>
  </defs>

  <rect width="1640" height="720" fill="url(#bg)"/>
  <rect width="1640" height="720" fill="url(#grid)" opacity=".6"/>
  
  <text x="70" y="70" class="title">VCF → Supervisor → Namespace → VKS Cluster → Kubernetes Namespace Flow</text>
  <text x="72" y="104" class="subtitle">A clean hierarchy from private cloud foundation to application work zones.</text>
  <g transform="translate(60 150)">
    <rect class="box" width="235" height="360" filter="url(#glow)"/><circle cx="38" cy="40" r="22" fill="url(#blue)"/><text x="32" y="48" class="num">1</text><text x="72" y="42" class="label">VCF Infrastructure</text><text x="72" y="68" class="small">Office Building</text><path d="M70 120 h105 v90 h-105z M90 120 v90 M115 120 v90 M140 120 v90 M165 120 v90 M70 150 h105 M70 180 h105" stroke="#38bdf8" opacity=".9" fill="none"/><text x="46" y="255" class="small">Compute</text><text x="46" y="285" class="small">Storage</text><text x="46" y="315" class="small">Network</text><text x="46" y="345" class="small">vCenter</text>
  </g>
  <path class="arrow" d="M310 330 H360"/>
  <g transform="translate(380 150)">
    <rect class="box" width="235" height="360" filter="url(#glow)"/><circle cx="38" cy="40" r="22" fill="url(#blue)"/><text x="32" y="48" class="num">2</text><text x="72" y="42" class="label">vSphere Supervisor</text><text x="72" y="68" class="small">Supervisor-enabled Floor</text><path d="M58 140 h120 v85 h-120z" stroke="#38bdf8" fill="none"/><circle cx="118" cy="182" r="35" stroke="#38bdf8" fill="none"/><text x="52" y="270" class="small">Control Plane VMs</text><text x="52" y="300" class="small">Spherelet</text><text x="52" y="330" class="small">CRX</text><text x="52" y="360" class="small">Services</text>
  </g>
  <path class="arrowp" d="M630 330 H680"/>
  <g transform="translate(700 150)">
    <rect class="box2" width="235" height="360" filter="url(#glow)"/><circle cx="38" cy="40" r="22" fill="url(#purple)"/><text x="32" y="48" class="num">3</text><text x="72" y="42" class="label">vSphere Namespace</text><text x="72" y="68" class="small">Department Wing</text><rect x="58" y="126" width="125" height="90" rx="10" fill="none" stroke="#a855f7"/><text x="86" y="175" class="small">NORTH WING</text><text x="50" y="260" class="small">Quotas</text><text x="50" y="290" class="small">Permissions</text><text x="50" y="320" class="small">VM Classes</text><text x="50" y="350" class="small">Storage Policies</text>
  </g>
  <path class="arrow" d="M950 330 H1000"/>
  <g transform="translate(1020 150)">
    <rect class="box3" width="235" height="360" filter="url(#glow)"/><circle cx="38" cy="40" r="22" fill="url(#green)"/><text x="32" y="48" class="num">4</text><text x="72" y="42" class="label">VKS Cluster</text><text x="72" y="68" class="small">Project Area</text><circle cx="118" cy="172" r="48" stroke="#22d3ee" fill="none"/><text x="85" y="179" class="label">K8s</text><text x="50" y="260" class="small">Control Plane Nodes</text><text x="50" y="290" class="small">Worker Nodes</text><text x="50" y="320" class="small">Kubernetes API</text><text x="50" y="350" class="small">Add-ons</text>
  </g>
  <path class="arrowg" d="M1270 330 H1320"/>
  <g transform="translate(1340 150)">
    <rect class="box4" width="235" height="360" filter="url(#glow)"/><circle cx="38" cy="40" r="22" fill="url(#yellow)"/><text x="32" y="48" class="num">5</text><text x="72" y="42" class="label">Kubernetes Namespace</text><text x="72" y="68" class="small">Work Zones</text><rect x="42" y="115" width="150" height="44" rx="10" class="chip"/><text x="66" y="143" class="small">cloud-services</text><rect x="42" y="175" width="150" height="44" rx="10" class="chip"/><text x="58" y="203" class="small">database-services</text><rect x="42" y="235" width="150" height="44" rx="10" class="chip"/><text x="76" y="263" class="small">monitoring</text><rect x="42" y="295" width="150" height="44" rx="10" class="chip"/><text x="80" y="323" class="small">operations</text>
  </g>
  <rect x="80" y="580" width="1480" height="80" rx="22" fill="rgba(15,23,42,.82)" stroke="#334155"/>
  <text x="130" y="630" class="small">Office Building = VCF Infrastructure</text><text x="455" y="630" class="small">Enabled Floor = Supervisor</text><text x="750" y="630" class="small">Department Wing = vSphere Namespace</text><text x="1110" y="630" class="small">Project Area = VKS Cluster</text><text x="1370" y="630" class="small">Work Zones = Kubernetes Namespaces</text>

</svg>
