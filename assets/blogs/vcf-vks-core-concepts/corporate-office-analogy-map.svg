<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="760" viewBox="0 0 1640 760" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#06142b"/><stop offset="1" stop-color="#05040f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.35" opacity="0.16"/></pattern>
    <style>
      .title{font:800 44px Manrope,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}.subtitle{font:500 20px DM Sans,Arial,sans-serif;fill:#a9b9d4}.label{font:700 18px DM Sans,Arial,sans-serif;fill:#f8fafc}.small{font:500 14px DM Sans,Arial,sans-serif;fill:#cbd5e1}.tiny{font:500 12px DM Sans,Arial,sans-serif;fill:#a8b4c7}.box{fill:rgba(7,18,38,.78);stroke:#2563eb;stroke-width:1.4;rx:20}.box2{fill:rgba(17,12,42,.72);stroke:#a855f7;stroke-width:1.4;rx:20}.box3{fill:rgba(6,31,28,.72);stroke:#14b8a6;stroke-width:1.4;rx:20}.box4{fill:rgba(34,26,4,.70);stroke:#eab308;stroke-width:1.4;rx:20}.chip{fill:rgba(15,23,42,.86);stroke:#3b82f6;stroke-width:1;rx:12}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#arrow)}.arrowp{stroke:#a855f7;stroke-width:4;fill:none;marker-end:url(#arrowp)}.arrowg{stroke:#84cc16;stroke-width:4;fill:none;marker-end:url(#arrowg)}.num{font:800 22px Manrope,Arial,sans-serif;fill:#fff}.accent-blue{fill:#38bdf8}.accent-purple{fill:#a855f7}.accent-green{fill:#84cc16}.accent-yellow{fill:#facc15}.muted{fill:#94a3b8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#84cc16"/></marker>
  </defs>

  <rect width="1640" height="760" fill="url(#bg)"/>
  <rect width="1640" height="760" fill="url(#grid)" opacity=".6"/>
  
  <text x="360" y="70" class="title">Corporate Office Analogy Map</text>
  <text x="470" y="105" class="subtitle">Mapping VCF and Kubernetes constructs to a corporate office structure.</text>
  <g transform="translate(70 155)"><rect class="box2" width="360" height="430"/><text x="95" y="45" class="label">CORPORATE OFFICE</text><path d="M90 130 h170 v260 h-170z M115 130 v260 M140 130 v260 M165 130 v260 M190 130 v260 M215 130 v260 M240 130 v260 M90 170 h170 M90 210 h170 M90 250 h170 M90 290 h170 M90 330 h170" stroke="#a855f7" fill="none" opacity=".9"/><rect x="70" y="355" width="220" height="55" rx="15" fill="rgba(168,85,247,.18)" stroke="#a855f7"/><text x="102" y="390" class="small">VCF Infrastructure</text></g>
  <path class="arrowp" d="M445 370 H520"/>
  <g transform="translate(535 155)"><rect class="box3" width="555" height="430"/><text x="120" y="45" class="label">SUPERVISOR-ENABLED FLOOR</text><text x="170" y="78" class="small">Managed by the Supervisor</text><rect x="50" y="120" width="205" height="175" rx="16" fill="rgba(14,165,233,.12)" stroke="#38bdf8"/><text x="95" y="150" class="label accent-blue">NORTH WING</text><text x="112" y="176" class="small">Central IT</text><rect x="300" y="120" width="205" height="175" rx="16" fill="rgba(132,204,22,.12)" stroke="#84cc16"/><text x="342" y="150" class="label accent-green">SOUTH WING</text><text x="340" y="176" class="small">Digital Banking</text><rect x="68" y="330" width="170" height="60" rx="16" fill="rgba(14,165,233,.14)" stroke="#38bdf8"/><text x="94" y="356" class="small">North Wing =</text><text x="72" y="380" class="small accent-blue">vSphere Namespace</text><rect x="318" y="330" width="170" height="60" rx="16" fill="rgba(132,204,22,.14)" stroke="#84cc16"/><text x="345" y="356" class="small">South Wing =</text><text x="322" y="380" class="small accent-green">vSphere Namespace</text></g>
  <path class="arrow" d="M1110 370 H1180"/>
  <g transform="translate(1200 155)"><rect class="box" width="360" height="430"/><text x="47" y="45" class="label accent-blue">PROJECT AREA</text><text x="62" y="73" class="small">VKS Cluster inside North Wing</text><rect x="50" y="120" width="260" height="110" rx="20" fill="rgba(34,211,238,.13)" stroke="#22d3ee"/><text x="110" y="180" class="label">VKS Runtime</text><path d="M180 230 v45" stroke="#38bdf8" stroke-dasharray="5 8"/><rect x="35" y="282" width="70" height="85" rx="12" fill="rgba(34,211,238,.11)" stroke="#22d3ee"/><text x="42" y="332" class="tiny">cloud</text><rect x="115" y="282" width="70" height="85" rx="12" fill="rgba(132,204,22,.11)" stroke="#84cc16"/><text x="119" y="332" class="tiny">database</text><rect x="195" y="282" width="70" height="85" rx="12" fill="rgba(234,179,8,.11)" stroke="#eab308"/><text x="202" y="332" class="tiny">monitor</text><rect x="275" y="282" width="70" height="85" rx="12" fill="rgba(168,85,247,.11)" stroke="#a855f7"/><text x="286" y="332" class="tiny">ops</text><text x="65" y="404" class="small">Work Zones = Kubernetes Namespaces</text></g>
  <rect x="80" y="630" width="1480" height="80" rx="22" fill="rgba(15,23,42,.82)" stroke="#334155"/><text x="145" y="680" class="small">Building = VCF</text><text x="365" y="680" class="small">Enabled Floor = Supervisor</text><text x="690" y="680" class="small">Wing = vSphere Namespace</text><text x="1030" y="680" class="small">Project Area = VKS Cluster</text><text x="1320" y="680" class="small">Work Zones = Kubernetes Namespaces</text>

</svg>
