  <g transform="translate(40 465)"><rect class="box2" width="1420" height="445"/><text x="20" y="70" class="label accent-purple">VSPHERE NAMESPACES</text><text x="20" y="100" class="small">Multi-tenant boundaries</text>
    <g transform="translate(155 35)"><rect class="box2" width="565" height="375"/><text x="130" y="35" class="label">vSphere Namespace: central-it-prod</text><text x="50" y="82" class="tiny">Resource quotas</text><text x="165" y="82" class="tiny">RBAC &amp; access</text><text x="285" y="82" class="tiny">VM classes</text><text x="395" y="82" class="tiny">Storage policies</text><rect x="28" y="115" width="510" height="150" rx="14" fill="rgba(8,47,73,.55)" stroke="#22d3ee"/><text x="145" y="143" class="label accent-blue">VKS Cluster: central-it-workloads</text><text x="70" y="190" class="tiny">Control Plane Nodes</text><text x="335" y="190" class="tiny">Worker Nodes</text><rect x="55" y="290" width="455" height="45" rx="12" fill="rgba(2,6,23,.5)" stroke="#22d3ee"/><text x="190" y="318" class="tiny">Kubernetes Namespaces: platform · monitoring · logging · app-team-a</text></g>
    <g transform="translate(770 35)"><rect class="box4" width="565" height="375"/><text x="110" y="35" class="label accent-yellow">vSphere Namespace: digital-banking-prod</text><text x="50" y="82" class="tiny">Resource quotas</text><text x="165" y="82" class="tiny">RBAC &amp; access</text><text x="285" y="82" class="tiny">VM classes</text><text x="395" y="82" class="tiny">Storage policies</text><rect x="28" y="115" width="510" height="150" rx="14" fill="rgba(69,26,3,.48)" stroke="#facc15"/><text x="145" y="143" class="label accent-yellow">VKS Cluster: digital-banking-apps</text><text x="70" y="190" class="tiny">Control Plane Nodes</text><text x="335" y="190" class="tiny">Worker Nodes</text><rect x="55" y="290" width="455" height="45" rx="12" fill="rgba(2,6,23,.5)" stroke="#facc15"/><text x="145" y="318" class="tiny">Kubernetes Namespaces: banking-apps · payments · analytics · security</text></g>
  </g>
  <g transform="translate(40 935)"><rect class="box3" width="1420" height="115"/><text x="20" y="50" class="label accent-green">VSPHERE ZONES</text><text x="20" y="78" class="small">Failure domains</text><rect x="190" y="25" width="320" height="65" rx="15" fill="rgba(20,83,45,.32)" stroke="#84cc16"/><text x="300" y="58" class="small">Zone 1 · vSphere Cluster A</text><rect x="560" y="25" width="320" height="65" rx="15" fill="rgba(20,83,45,.32)" stroke="#84cc16"/><text x="670" y="58" class="small">Zone 2 · vSphere Cluster B</text><rect x="930" y="25" width="320" height="65" rx="15" fill="rgba(20,83,45,.32)" stroke="#84cc16"/><text x="1040" y="58" class="small">Zone 3 · vSphere Cluster C</text></g>
  <g transform="translate(40 1075)"><rect class="box" width="1420" height="90"/><text x="20" y="42" class="label accent-blue">SHARED INFRASTRUCTURE</text><rect x="230" y="18" width="320" height="55" rx="12" class="chip"/><text x="345" y="52" class="small">Compute</text><rect x="580" y="18" width="320" height="55" rx="12" class="chip"/><text x="700" y="52" class="small">Storage</text><rect x="930" y="18" width="320" height="55" rx="12" class="chip"/><text x="1055" y="52" class="small">Network</text></g>
  <g transform="translate(1495 85)"><rect class="box" width="300" height="640"/><text x="35" y="38" class="label accent-purple">KEY CONSTRUCTS</text><text x="35" y="90" class="small accent-purple">vSphere Supervisor</text><text x="35" y="112" class="tiny">Platform control layer</text><text x="35" y="160" class="small accent-blue">vSphere Namespace</text><text x="35" y="182" class="tiny">Governed platform boundary</text><text x="35" y="230" class="small accent-blue">VKS Cluster</text><text x="35" y="252" class="tiny">Kubernetes runtime</text><text x="35" y="300" class="small accent-purple">Kubernetes Namespace</text><text x="35" y="322" class="tiny">Logical separation in cluster</text><text x="35" y="370" class="small accent-green">vSphere Zones</text><text x="35" y="392" class="tiny">Failure-domain layer</text><text x="35" y="440" class="small accent-blue">Spherelet</text><text x="35" y="462" class="tiny">ESX-side kubelet integration</text><text x="35" y="510" class="small accent-purple">CRX</text><text x="35" y="532" class="tiny">Runtime for vSphere Pods</text></g>
  <rect x="120" y="1200" width="1560" height="82" rx="24" fill="rgba(15,23,42,.88)" stroke="#334155"/><text x="355" y="1250" class="label">Supervisor governs the platform. Namespaces define boundaries. VKS clusters run workloads. Zones provide resilience.</text>

</svg>
