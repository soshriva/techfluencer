<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="780" viewBox="0 0 1640 780" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#06142b"/><stop offset="1" stop-color="#05040f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.35" opacity="0.16"/></pattern>
    <style>
      .title{font:800 44px Manrope,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}.subtitle{font:500 20px DM Sans,Arial,sans-serif;fill:#a9b9d4}.label{font:700 18px DM Sans,Arial,sans-serif;fill:#f8fafc}.small{font:500 14px DM Sans,Arial,sans-serif;fill:#cbd5e1}.tiny{font:500 12px DM Sans,Arial,sans-serif;fill:#a8b4c7}.box{fill:rgba(7,18,38,.78);stroke:#2563eb;stroke-width:1.4;rx:20}.box2{fill:rgba(17,12,42,.72);stroke:#a855f7;stroke-width:1.4;rx:20}.box3{fill:rgba(6,31,28,.72);stroke:#14b8a6;stroke-width:1.4;rx:20}.box4{fill:rgba(34,26,4,.70);stroke:#eab308;stroke-width:1.4;rx:20}.chip{fill:rgba(15,23,42,.86);stroke:#3b82f6;stroke-width:1;rx:12}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#arrow)}.arrowp{stroke:#a855f7;stroke-width:4;fill:none;marker-end:url(#arrowp)}.arrowg{stroke:#84cc16;stroke-width:4;fill:none;marker-end:url(#arrowg)}.num{font:800 22px Manrope,Arial,sans-serif;fill:#fff}.accent-blue{fill:#38bdf8}.accent-purple{fill:#a855f7}.accent-green{fill:#84cc16}.accent-yellow{fill:#facc15}.muted{fill:#94a3b8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#84cc16"/></marker>
  </defs>

  <rect width="1640" height="780" fill="url(#bg)"/>
  <rect width="1640" height="780" fill="url(#grid)" opacity=".6"/>
  
  <text x="160" y="80" class="title">vSphere Namespace as a Governed Department Wing</text>
  <g transform="translate(70 145)"><rect class="box2" width="750" height="470"/><rect x="70" y="75" width="610" height="300" rx="18" fill="rgba(15,23,42,.6)" stroke="#a855f7"/><text x="235" y="235" class="title" font-size="36">NORTH WING</text><text x="310" y="275" class="subtitle">Central IT</text><rect x="185" y="390" width="390" height="70" rx="18" fill="rgba(168,85,247,.16)" stroke="#a855f7"/><text x="248" y="435" class="label">vSphere Namespace = Department Wing</text></g>
  <g transform="translate(875 145)"><rect class="box" width="690" height="470"/><text x="155" y="70" class="title" font-size="34">Governed by Platform Team</text><g transform="translate(55 110)"><rect class="chip" width="575" height="48"/><text x="75" y="31" class="label">1. These users can enter</text><circle cx="32" cy="24" r="16" stroke="#38bdf8" fill="none"/></g><g transform="translate(55 175)"><rect class="chip" width="575" height="48"/><text x="75" y="31" class="label">2. These workstation sizes are approved</text><rect x="20" y="14" width="28" height="22" stroke="#38bdf8" fill="none"/></g><g transform="translate(55 240)"><rect class="chip" width="575" height="48"/><text x="75" y="31" class="label">3. These meeting rooms are available</text><circle cx="25" cy="25" r="10" stroke="#84cc16" fill="none"/><circle cx="45" cy="25" r="10" stroke="#84cc16" fill="none"/></g><g transform="translate(55 305)"><rect class="chip" width="575" height="48"/><text x="75" y="31" class="label">4. These storage policies are available</text><ellipse cx="34" cy="17" rx="18" ry="8" stroke="#84cc16" fill="none"/><path d="M16 17 v20 c0 5 36 5 36 0 v-20" stroke="#84cc16" fill="none"/></g><g transform="translate(55 370)"><rect class="chip" width="575" height="58"/><text x="75" y="26" class="label">5. This is your capacity limit</text><text x="75" y="48" class="small">only this number of users can work in the wing</text><path d="M20 35 a20 20 0 0 1 40 0" stroke="#facc15" fill="none"/></g></g>
  <rect x="150" y="665" width="1340" height="75" rx="22" fill="rgba(15,23,42,.82)" stroke="#334155"/><text x="330" y="713" class="label">A vSphere Namespace provides a controlled platform boundary for teams and workloads</text>

</svg>
