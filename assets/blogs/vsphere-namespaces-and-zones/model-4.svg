<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Blog 4, Model 4 — Three Supervisor Management Zones with dedicated vSphere Zones for application workloads</title>
  <desc id="desc">Three Supervisor control-plane VMs span three Management Zones. Applications use one or more separate dedicated vSphere Zones.</desc>
