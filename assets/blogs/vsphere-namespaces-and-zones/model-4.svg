  <text x="92" y="100" class="t k">SUPERVISOR DEPLOYMENT MODEL · 04</text><text x="92" y="138" class="t h">Three Management Zones — dedicated vSphere Zone(s)</text><text x="92" y="166" class="t h">for application workloads</text><text x="100" y="220" class="t" font-size="20" fill="#4c6078">The Supervisor spans three Management Zones. Applications run in separate vSphere Zones.</text>
