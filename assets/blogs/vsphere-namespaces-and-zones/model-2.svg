<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Blog 4, Model 2 — One Supervisor Management Zone with dedicated vSphere Zones for application workloads</title>
  <desc id="desc">The Supervisor control plane uses one Management Zone. Applications use one or more separate dedicated vSphere Zones.</desc>
  <style>.t{font-family:Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#fff}.k{font-size:20px;font-weight:700;fill:#73dcff}.z{font-size:23px;font-weight:700;fill:#174454}.b{font-size:18px;fill:#4c6078}.w{font-size:19px;font-weight:700;fill:#fff}.s{font-size:16px;fill:#e8e3ff}.f{font-size:18px;fill:#314b66}.m{font-size:18px;font-weight:700;fill:#174454}</style>
  <rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/>
  <text x="92" y="100" class="t k">SUPERVISOR DEPLOYMENT MODEL · 02</text><text x="92" y="145" class="t h">One Management Zone — dedicated vSphere Zone(s) for application workloads</text>
  <rect x="100" y="230" width="440" height="360" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><text x="145" y="280" class="t z">Supervisor Management Zone</text><text x="145" y="312" class="t b">Reserved for Supervisor management.</text>
  <rect x="170" y="382" width="300" height="105" rx="18" fill="#5b43d6"/><text x="320" y="423" text-anchor="middle" class="t w">Supervisor control plane</text><text x="320" y="453" text-anchor="middle" class="t s">1 VM or 3 HA VMs</text>
  <path d="M575 408H720" stroke="#54708e" stroke-width="4"/><path d="M710 398l18 10-18 10" fill="#54708e"/>
  <rect x="760" y="230" width="540" height="360" rx="28" fill="#f0f6ff" stroke="#2877e0" stroke-width="3" stroke-dasharray="12 8"/><text x="805" y="280" class="t z">Dedicated vSphere Zone(s)</text><text x="805" y="312" class="t b">Separate capacity for VKS and application workloads.</text>
  <rect x="820" y="382" width="190" height="105" rx="18" fill="#1971d4"/><text x="915" y="423" text-anchor="middle" class="t w">vSphere Zone 1</text><text x="915" y="453" text-anchor="middle" class="t" font-size="16" fill="#dbeaff">VKS / apps</text>
  <rect x="1050" y="382" width="190" height="105" rx="18" fill="#1971d4"/><text x="1145" y="423" text-anchor="middle" class="t w">vSphere Zone 2</text><text x="1145" y="453" text-anchor="middle" class="t" font-size="16" fill="#dbeaff">optional</text>
  <rect x="100" y="640" width="1200" height="68" rx="16" fill="#e6eef8"/><text x="140" y="682" class="t m">Meaning:</text><text x="250" y="682" class="t f">The Supervisor stays in one Management Zone; applications are intentionally kept in separate vSphere Zones.</text>
</svg>
