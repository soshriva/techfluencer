<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Blog 4, Model 1 — One Supervisor Management Zone with shared application capacity</title>
  <desc id="desc">Supervisor control-plane VMs and application workloads use capacity in one Supervisor Management Zone.</desc>
  <style>.t{font-family:Arial,sans-serif}.h{font-size:34px;font-weight:700;fill:#fff}.k{font-size:20px;font-weight:700;fill:#73dcff}.z{font-size:25px;font-weight:700;fill:#174454}.b{font-size:19px;fill:#4c6078}.w{font-size:20px;font-weight:700;fill:#fff}.s{font-size:17px;fill:#e8e3ff}.f{font-size:18px;fill:#314b66}.m{font-size:18px;font-weight:700;fill:#174454}</style>
  <rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/>
  <text x="92" y="100" class="t k">SUPERVISOR DEPLOYMENT MODEL · 01</text><text x="92" y="145" class="t h">One Management Zone — shared application capacity</text>
  <rect x="110" y="230" width="1180" height="350" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="160" y="292" class="t z">Supervisor Management Zone</text><text x="160" y="325" class="t b">One vSphere Zone provides capacity for both the Supervisor and application workloads.</text>
  <rect x="205" y="390" width="400" height="115" rx="18" fill="#5b43d6"/><text x="405" y="432" text-anchor="middle" class="t w">Supervisor control plane</text><text x="405" y="463" text-anchor="middle" class="t s">1 VM or 3 HA VMs</text>
  <rect x="790" y="390" width="400" height="115" rx="18" fill="#1971d4"/><text x="990" y="432" text-anchor="middle" class="t w">VKS / application workloads</text><text x="990" y="463" text-anchor="middle" class="t" font-size="17" fill="#dbeaff">share Management Zone capacity</text>
  <rect x="110" y="640" width="1180" height="68" rx="16" fill="#e6eef8"/><text x="150" y="682" class="t m">Meaning:</text><text x="260" y="682" class="t f">Simplest placement: management and application capacity are intentionally shared.</text>
</svg>
