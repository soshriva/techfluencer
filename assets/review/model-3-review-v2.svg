<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Model 3 — Three Supervisor Management Zones with shared application capacity</title>
  <desc id="desc">Three Supervisor control-plane VMs span three Management Zones. Application workloads share capacity within those Management Zones.</desc>
  <style>.t{font-family:Arial,sans-serif}.h{font-size:33px;font-weight:700;fill:#fff}.k{font-size:20px;font-weight:700;fill:#73dcff}.z{font-size:19px;font-weight:700;fill:#174454}.b{font-size:16px;fill:#4c6078}.w{font-size:18px;font-weight:700;fill:#fff}.s{font-size:15px;fill:#dbeaff}.f{font-size:18px;fill:#314b66}.m{font-size:18px;font-weight:700;fill:#174454}</style>
  <rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/>
  <text x="92" y="100" class="t k">SUPERVISOR DEPLOYMENT MODEL · 03</text><text x="92" y="145" class="t h">Three Management Zones — shared application capacity</text><text x="100" y="220" class="t" font-size="20" fill="#4c6078">The Supervisor spans three Management Zones; applications use capacity in those same zones.</text>
