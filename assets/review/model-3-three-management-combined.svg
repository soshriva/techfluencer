<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Model 3 — Three Management Zones with combined workload capacity</title><desc id="desc">Three Supervisor control plane VMs span three Management Zones, which also provide workload capacity.</desc><style>.t{font-family:Arial,sans-serif}.z{font-size:22px;font-weight:700;fill:#174454}.l{font-size:19px;font-weight:700;fill:white}.b{font-size:17px;fill:#4c6078}.n{font-size:18px;font-weight:700;fill:#174454}</style><rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/><text x="92" y="100" class="t" font-size="20" font-weight="700" fill="#72dcff">ZONE TOPOLOGY · MODEL 3</text><text x="92" y="145" class="t" font-size="38" font-weight="700" fill="white">Three Management Zones + combined workload capacity</text><text x="100" y="220" class="t" font-size="20" fill="#4c6078">The production Supervisor control plane spans three Management Zones. Workloads use those same zones.</text><g><rect x="100" y="260" width="370" height="330" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><rect x="515" y="260" width="370" height="330" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><rect x="930" y="260" width="370" height="330" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><text x="135" y="310" class="t z">Management Zone 1</text><text x="550" y="310" class="t z">Management Zone 2</text><text x="965" y="310" class="t z">Management Zone 3</text><rect x="160" y="350" width="250" height="58" rx="14" fill="#5b43d6"/><text x="285" y="386" text-anchor="middle" class="t l">CP-1</text><rect x="575" y="350" width="250" height="58" rx="14" fill="#5b43d6"/><text x="700" y="386" text-anchor="middle" class="t l">CP-2</text><rect x="990" y="350" width="250" height="58" rx="14" fill="#5b43d6"/><text x="1115" y="386" text-anchor="middle" class="t l">CP-3</text><rect x="160" y="450" width="250" height="76" rx="14" fill="#1971d4"/><text x="285" y="482" text-anchor="middle" class="t l">Workload capacity</text><text x="285" y="508" text-anchor="middle" class="t" font-size="15" fill="#dbeaff">VKS / apps</text><rect x="575" y="450" width="250" height="76" rx="14" fill="#1971d4"/><text x="700" y="482" text-anchor="middle" class="t l">Workload capacity</text><text x="700" y="508" text-anchor="middle" class="t" font-size="15" fill="#dbeaff">VKS / apps</text><rect x="990" y="450" width="250" height="76" rx="14" fill="#1971d4"/><text x="1115" y="482" text-anchor="middle" class="t l">Workload capacity</text><text x="1115" y="508" text-anchor="middle" class="t" font-size="15" fill="#dbeaff">VKS / apps</text></g><rect x="100" y="640" width="1200" height="68" rx="16" fill="#e6eef8"/><text x="140" y="682" class="t n">Meaning:</text><text x="250" y="682" class="t" font-size="18" fill="#314b66">Zone-level management-plane resilience, while workloads still share the same three Management Zones.</text></svg>
