<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Model 4 — Three Management Zones with dedicated vSphere Zones for workloads</title><desc id="desc">Three Supervisor control plane VMs span three Management Zones. Application workloads use one or more separate dedicated vSphere Zones.</desc><style>.t{font-family:Arial,sans-serif}.z{font-size:20px;font-weight:700;fill:#174454}.l{font-size:18px;font-weight:700;fill:white}.b{font-size:16px;fill:#4c6078}.n{font-size:18px;font-weight:700;fill:#174454}</style><rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/><text x="92" y="100" class="t" font-size="20" font-weight="700" fill="#72dcff">ZONE TOPOLOGY · MODEL 4</text><text x="92" y="145" class="t" font-size="34" font-weight="700" fill="white">Three Management Zones + dedicated vSphere Zone(s) for workloads</text><text x="100" y="220" class="t" font-size="20" fill="#4c6078">The Supervisor spans three dedicated Management Zones. Applications run in separate vSphere Zones.</text><g><rect x="75" y="260" width="270" height="270" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><rect x="375" y="260" width="270" height="270" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><rect x="675" y="260" width="270" height="270" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><text x="105" y="310" class="t z">Management Zone 1</text><text x="405" y="310" class="t z">Management Zone 2</text><text x="705" y="310" class="t z">Management Zone 3</text><rect x="115" y="365" width="190" height="60" rx="14" fill="#5b43d6"/><text x="210" y="402" text-anchor="middle" class="t l">CP-1</text><rect x="415" y="365" width="190" height="60" rx="14" fill="#5b43d6"/><text x="510" y="402" text-anchor="middle" class="t l">CP-2</text><rect x="715" y="365" width="190" height="60" rx="14" fill="#5b43d6"/><text x="810" y="402" text-anchor="middle" class="t l">CP-3</text></g><path d="M980 395H1040" stroke="#54708e" stroke-width="4"/><path d="M1030 385l18 10-18 10" fill="#54708e"/><rect x="1060" y="260" width="265" height="270" rx="28" fill="#f0f6ff" stroke="#2877e0" stroke-width="3" stroke-dasharray="12 8"/><text x="1090" y="310" class="t z">Dedicated vSphere Zone(s)</text><text x="1090" y="340" class="t b">Separate capacity</text><rect x="1100" y="382" width="185" height="75" rx="14" fill="#1971d4"/><text x="1192" y="414" text-anchor="middle" class="t l">VKS / apps</text><text x="1192" y="440" text-anchor="middle" class="t" font-size="15" fill="#dbeaff">one or more zones</text><rect x="75" y="640" width="1250" height="68" rx="16" fill="#e6eef8"/><text x="115" y="682" class="t n">Meaning:</text><text x="225" y="682" class="t" font-size="18" fill="#314b66">Most separation: resilient Supervisor placement plus independently scaled and isolated workload capacity.</text></svg>
