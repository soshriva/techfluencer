<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Model 1 — Single Management Zone with combined workload capacity</title><desc id="desc">The Supervisor control plane and VKS workloads share one vSphere Zone.</desc>
<style>.t{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700;fill:#10233d}.sub{font-size:21px;fill:#566980}.z{font-size:22px;font-weight:700;fill:#174454}.l{font-size:19px;font-weight:700;fill:white}.b{font-size:18px;fill:#4c6078}.n{font-size:18px;font-weight:700;fill:#174454}</style>
<rect width="1400" height="760" fill="#f6f9fd"/><rect x="46" y="42" width="1308" height="132" rx="24" fill="#0b2545"/><text x="92" y="100" class="t" font-size="20" font-weight="700" fill="#72dcff">ZONE TOPOLOGY · MODEL 1</text><text x="92" y="145" class="t" font-size="38" font-weight="700" fill="white">Single Management Zone + combined workload capacity</text>
<rect x="100" y="230" width="1200" height="360" rx="28" fill="#effaf7" stroke="#1d9a80" stroke-width="3" stroke-dasharray="12 8"/><text x="145" y="280" class="t z">Management Zone 1</text><text x="145" y="312" class="t b">The Supervisor and workload capacity share this one zone.</text>
<rect x="176" y="365" width="440" height="100" rx="18" fill="#5b43d6"/><text x="396" y="406" text-anchor="middle" class="t l">Supervisor control plane</text><text x="396" y="437" text-anchor="middle" class="t" font-size="16" fill="#e6e1ff">1 VM for evaluation, or 3 HA VMs across hosts</text>
<rect x="785" y="365" width="420" height="100" rx="18" fill="#1971d4"/><text x="995" y="406" text-anchor="middle" class="t l">VKS / application workloads</text><text x="995" y="437" text-anchor="middle" class="t" font-size="16" fill="#dbeaff">Use capacity in Management Zone 1</text>
<path d="M630 415H760" stroke="#54708e" stroke-width="4"/><path d="M750 405l18 10-18 10" fill="#54708e"/>
<rect x="100" y="640" width="1200" height="68" rx="16" fill="#e6eef8"/><text x="140" y="682" class="t n">Meaning:</text><text x="250" y="682" class="t" font-size="18" fill="#314b66">Simplest topology. The platform-management and workload layers use the same vSphere Zone.</text></svg>
