<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">Four vSphere Supervisor Zone design models</title>
  <desc id="desc">A two by two comparison of one or three Management Zones, and combined or isolated Workload Zones. Control-plane VM count is shown as a separate availability decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b36"/><stop offset="1" stop-color="#102b50"/></linearGradient>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#10233d}.sub{font:400 22px Arial,sans-serif;fill:#52657d}.head{font:700 24px Arial,sans-serif;fill:#fff}.label{font:700 20px Arial,sans-serif;fill:#10233d}.small{font:400 17px Arial,sans-serif;fill:#425872}.tiny{font:700 15px Arial,sans-serif;fill:#183653}.note{font:400 16px Arial,sans-serif;fill:#dbe9ff}.cardtitle{font:700 26px Arial,sans-serif;fill:#10233d}.cardtext{font:400 18px Arial,sans-serif;fill:#38516d}.zonetext{font:700 17px Arial,sans-serif;fill:#183653}.pill{font:700 15px Arial,sans-serif;fill:#fff}.footer{font:600 18px Arial,sans-serif;fill:#10233d}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56728f"/></marker>
  </defs>
  <rect width="1600" height="1220" fill="#f5f8fc"/>
  <rect x="34" y="30" width="1532" height="180" rx="28" fill="url(#bg)"/>
  <text x="80" y="100" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">vSphere Supervisor Zone Models</text>
  <text x="80" y="145" font-family="Arial,sans-serif" font-size="25" fill="#b9d7ff">The same four architecture patterns, redrawn for clear placement decisions</text>
  <rect x="948" y="63" width="570" height="108" rx="18" fill="#12385e" stroke="#4ed0ff"/>
  <text x="980" y="101" class="head">First decide Supervisor availability</text>
  <text x="980" y="135" class="note">1 control-plane VM for lab / evaluation · 3 VMs for production HA</text>
  <text x="980" y="159" class="note">This is separate from the number of Management Zones.</text>

  <text x="305" y="270" text-anchor="middle" class="label">COMBINED WORKLOAD ZONES</text>
  <text x="305" y="299" text-anchor="middle" class="small">Workloads use the Management Zone(s)</text>
  <text x="1110" y="270" text-anchor="middle" class="label">ISOLATED WORKLOAD ZONES</text>
  <text x="1110" y="299" text-anchor="middle" class="small">Workloads use additional, separate zones</text>
  <rect x="70" y="320" width="285" height="72" rx="16" fill="#1b7e6a"/><text x="212" y="350" text-anchor="middle" class="head">ONE</text><text x="212" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#fff">Management Zone</text>
  <rect x="70" y="755" width="285" height="72" rx="16" fill="#2459b6"/><text x="212" y="785" text-anchor="middle" class="head">THREE</text><text x="212" y="811" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#fff">Management Zones</text>

  <!-- Model 1 -->
  <rect x="385" y="320" width="560" height="400" rx="24" fill="#fff" stroke="#c9d8e8" stroke-width="2"/>
  <rect x="411" y="346" width="48" height="42" rx="10" fill="#18836d"/><text x="435" y="375" text-anchor="middle" class="head">1</text>
  <text x="478" y="376" class="cardtitle">Combined in one zone</text>
  <text x="411" y="416" class="cardtext">Single Management Zone with combined workload capacity</text>
  <rect x="435" y="450" width="455" height="190" rx="18" fill="#effaf7" stroke="#1b987e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="462" y="483" class="zonetext">Zone 1 · Management + Workload</text>
  <rect x="470" y="506" width="382" height="52" rx="10" fill="#5c43d6"/><text x="661" y="538" text-anchor="middle" class="pill">Supervisor control plane</text>
  <line x1="470" y1="577" x2="852" y2="577" stroke="#9ab1c6"/>
  <rect x="516" y="592" width="284" height="29" rx="8" fill="#1971d4"/><text x="658" y="613" text-anchor="middle" class="pill">Application / VKS workloads</text>
  <text x="415" y="684" class="cardtext">Simplest model: management and workload capacity share one zone.</text>

  <!-- Model 2 -->
  <rect x="970" y="320" width="560" height="400" rx="24" fill="#fff" stroke="#c9d8e8" stroke-width="2"/>
  <rect x="996" y="346" width="48" height="42" rx="10" fill="#2364cb"/><text x="1020" y="375" text-anchor="middle" class="head">2</text>
  <text x="1063" y="376" class="cardtitle">Workloads in separate zones</text>
  <text x="996" y="416" class="cardtext">Single Management Zone with isolated Workload Zone(s)</text>
  <rect x="1008" y="454" width="180" height="178" rx="18" fill="#effaf7" stroke="#1b987e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1098" y="487" text-anchor="middle" class="zonetext">Zone 1</text><text x="1098" y="512" text-anchor="middle" class="small">Management</text>
  <rect x="1033" y="538" width="130" height="48" rx="9" fill="#5c43d6"/><text x="1098" y="568" text-anchor="middle" class="pill">Control plane</text>
  <line x1="1208" y1="544" x2="1263" y2="544" stroke="#56728f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1280" y="454" width="220" height="178" rx="18" fill="#f1f6ff" stroke="#2877e0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1390" y="487" text-anchor="middle" class="zonetext">1+ Workload Zones</text><text x="1390" y="512" text-anchor="middle" class="small">Isolated</text>
  <rect x="1306" y="538" width="168" height="48" rx="9" fill="#1971d4"/><text x="1390" y="568" text-anchor="middle" class="pill">Workloads</text>
  <text x="996" y="684" class="cardtext">Dedicated workload capacity enables stronger separation and independent scaling.</text>

  <!-- Model 3 -->
  <rect x="385" y="755" width="560" height="400" rx="24" fill="#fff" stroke="#c9d8e8" stroke-width="2"/>
  <rect x="411" y="781" width="48" height="42" rx="10" fill="#2364cb"/><text x="435" y="810" text-anchor="middle" class="head">3</text>
  <text x="478" y="811" class="cardtitle">Combined across three zones</text>
  <text x="411" y="851" class="cardtext">Three Management Zones with combined workload capacity</text>
  <text x="425" y="890" class="zonetext">Management Zones: Supervisor components span the three zones</text>
  <g>
    <rect x="425" y="915" width="145" height="112" rx="14" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="498" y="945" text-anchor="middle" class="zonetext">Zone 1</text><rect x="449" y="962" width="98" height="34" rx="7" fill="#5c43d6"/><text x="498" y="985" text-anchor="middle" class="pill">CP-1</text>
    <rect x="590" y="915" width="145" height="112" rx="14" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="663" y="945" text-anchor="middle" class="zonetext">Zone 2</text><rect x="614" y="962" width="98" height="34" rx="7" fill="#5c43d6"/><text x="663" y="985" text-anchor="middle" class="pill">CP-2</text>
    <rect x="755" y="915" width="145" height="112" rx="14" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="828" y="945" text-anchor="middle" class="zonetext">Zone 3</text><rect x="779" y="962" width="98" height="34" rx="7" fill="#5c43d6"/><text x="828" y="985" text-anchor="middle" class="pill">CP-3</text>
  </g>
  <rect x="442" y="1054" width="430" height="61" rx="12" fill="#e9f2ff" stroke="#2877e0" stroke-width="2" stroke-dasharray="7 5"/><text x="657" y="1080" text-anchor="middle" class="zonetext">Workloads use these same three zones</text><text x="657" y="1104" text-anchor="middle" class="small">Shared capacity across Zone 1, Zone 2 and Zone 3</text>

  <!-- Model 4 -->
  <rect x="970" y="755" width="560" height="400" rx="24" fill="#fff" stroke="#c9d8e8" stroke-width="2"/>
  <rect x="996" y="781" width="48" height="42" rx="10" fill="#5c43d6"/><text x="1020" y="810" text-anchor="middle" class="head">4</text>
  <text x="1063" y="811" class="cardtitle">Three management, separate workload zones</text>
  <text x="996" y="851" class="cardtext">Three Management Zones with isolated Workload Zone(s)</text>
  <g>
    <rect x="1005" y="885" width="115" height="104" rx="13" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="1062" y="915" text-anchor="middle" class="zonetext">Zone 1</text><rect x="1021" y="937" width="82" height="32" rx="7" fill="#5c43d6"/><text x="1062" y="959" text-anchor="middle" class="pill">CP-1</text>
    <rect x="1140" y="885" width="115" height="104" rx="13" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="1197" y="915" text-anchor="middle" class="zonetext">Zone 2</text><rect x="1156" y="937" width="82" height="32" rx="7" fill="#5c43d6"/><text x="1197" y="959" text-anchor="middle" class="pill">CP-2</text>
    <rect x="1275" y="885" width="115" height="104" rx="13" fill="#effaf7" stroke="#1b987e" stroke-width="2"/><text x="1332" y="915" text-anchor="middle" class="zonetext">Zone 3</text><rect x="1291" y="937" width="82" height="32" rx="7" fill="#5c43d6"/><text x="1332" y="959" text-anchor="middle" class="pill">CP-3</text>
  </g>
  <line x1="1197" y1="1004" x2="1197" y2="1037" stroke="#56728f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1050" y="1050" width="292" height="66" rx="12" fill="#f1f6ff" stroke="#2877e0" stroke-width="2" stroke-dasharray="7 5"/><text x="1196" y="1078" text-anchor="middle" class="zonetext">1+ Workload Zones · Isolated</text><text x="1196" y="1103" text-anchor="middle" class="small">Dedicated workload capacity</text>
  <text x="997" y="1144" class="cardtext">Strongest separation; higher infrastructure and operational complexity.</text>

  <rect x="34" y="1175" width="1532" height="28" rx="12" fill="#e3edf8"/>
  <text x="800" y="1196" text-anchor="middle" class="footer">A Management Zone is a placement / failure-domain decision. It is not a control-plane VM count.</text>
</svg>
